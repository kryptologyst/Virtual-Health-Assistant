# Base configuration for Virtual Health Assistant

# Model configuration
model:
  name: "emilyalsentzer/Bio_ClinicalBERT"
  max_length: 512
  num_intents: 8
  num_entities: 9
  dropout: 0.1
  learning_rate: 2e-5
  batch_size: 16
  num_epochs: 3

# Data configuration
data:
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  max_samples: 1000
  deid_enabled: true

# Training configuration
training:
  device: "auto"
  seed: 42
  gradient_accumulation_steps: 1
  warmup_steps: 100
  weight_decay: 0.01
  save_best_model: true
  early_stopping_patience: 3

# Evaluation configuration
evaluation:
  metrics: ["accuracy", "f1", "precision", "recall", "auroc", "auprc"]
  calibration: true
  uncertainty: true
  explainability: true

# Intent labels
intent_labels:
  - "symptom_log"
  - "med_reminder"
  - "medical_question"
  - "appointment_request"
  - "medication_inquiry"
  - "general_health"
  - "emergency"
  - "other"

# Entity labels
entity_labels:
  - "O"
  - "SYMPTOM"
  - "MEDICATION"
  - "CONDITION"
  - "BODY_PART"
  - "DOSAGE"
  - "FREQUENCY"
  - "DURATION"
  - "SEVERITY"
